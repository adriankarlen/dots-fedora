# fuzzel - application launcher (bound to $mod+space in the sway config)
# Rose Pine, flat/squared, matching sway + waybar + mako.
# Colors are RRGGBBAA (8 digits, trailing alpha).

font=Berkeley Mono:size=14
dpi-aware=no
prompt="  "
placeholder=Search
icons-enabled=no

terminal=ghostty -e

anchor=center
lines=12
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=6

layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=191724ff
text=e0def4ff
prompt=908caaff
placeholder=6e6a86ff
input=e0def4ff
match=c4a7e7ff
selection=26233aff
selection-text=e0def4ff
selection-match=c4a7e7ff
counter=6e6a86ff
border=403d52ff

[border]
width=2
radius=0
