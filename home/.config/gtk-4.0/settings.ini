[Settings]
gtk-font-name = Berkeley Mono 10
gtk-icon-theme-name = rose-pine-icons
gtk-application-prefer-dark-theme = 1

# No gtk-theme-name here on purpose: rose-pine-gtk ships no gtk-4.0/ directory,
# so GTK4 colours come from ~/.config/gtk-4.0/gtk.css (libadwaita @define-color
# overrides) instead of from a named theme.
