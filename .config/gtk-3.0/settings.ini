[Settings]
gtk-font-name = Berkeley Mono 10
gtk-theme-name = rose-pine-gtk
gtk-icon-theme-name = rose-pine-icons

# Deliberately 0, and NOT a mistake. rose-pine-gtk v2.2.0 ships its two GTK3
# stylesheets inverted: dist/gtk.css is the DARK Rose Pine theme
# (theme_bg_color #1f1d2e, theme_base_color #26233a) while dist/gtk-dark.css is
# a LIGHT theme (#f0f0f3 / #c5c3ce). Setting this to 1 makes GTK3 load
# gtk-dark.css and you get a light window. Verified by querying
# Gtk.StyleContext.lookup_color() with the flag both ways.
# GTK4 is unaffected -- see ~/.config/gtk-4.0/settings.ini.
gtk-application-prefer-dark-theme = 0
